name: Newsibly Radar

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests
          playwright install --with-deps chromium

      - name: Run Newsibly reader
        run: |
          python newsibly_reader.py \
            --limit 20 \
            --save newsibly_latest20.json \
            --archive newsibly_archive24h.json

      - name: Commit results
        run: |
          git config user.name "Newsibly Radar"
          git config user.email "actions@users.noreply.github.com"

          git add \
            newsibly_latest20.json \
            newsibly_archive24h.json

          git diff --cached --quiet || \
            git commit -m "Update Newsibly 24h pool"

          git push
